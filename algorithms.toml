# Algorithm registry.
#
# Each block is one algorithm the benchmark can run. `module`/`class` name a Python class
# implementing algorithms.common.interface.Scheduler. `sources` lists the files and folders
# whose bytes define the algorithm: when any of them changes, the algorithm is rerun.
# `reference` names where the historical (pre-repository) result for this exact version is
# kept under reference/, so tools/verify_replay.py can check the rerun matches it.
#
# role: comparator  = published baseline (adapted to the fixed IFC model; see docs/paper_audits)
#       proposed    = the DCR line (the paper's method and its history)
# enabled = false keeps an algorithm out of "all".

[heft-ifc]
label = "HEFT-IFC"
module = "algorithms.heft_ifc"
class = "HeftIFCScheduler"
role = "comparator"
sources = ["algorithms/heft_ifc", "algorithms/common", "algorithms/__init__.py"]
reference = ["primary:deterministic_heft_ifc", "expansion:deterministic_heft_ifc"]

