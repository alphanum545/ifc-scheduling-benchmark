name: Robustness

# Fixed decisions re-evaluated under seeded runtime/bandwidth noise (+-10/20/30%, K draws each),
# plus IoT/fog/cloud placement share of every nominal schedule. Protocol:
# docs/proposed/EXPERIMENTS_PAPER1.md. Results: results/robustness/<set>.csv.gz.

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Instance set"
        default: "dev"
        type: choice
        options: [dev, expansion]
      draws:
        description: "Perturbation draws per noise level"
        default: "10"
      shards:
        description: "Parallel machines"
        default: "40"

permissions:
  contents: write

concurrency:
  group: robustness-${{ inputs.set }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: python3 -c "import json;print('matrix='+json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -r requirements.txt
      - name: Download and verify data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/data.py fetch --set ${{ inputs.set }} --out data/${{ inputs.set }}
      - name: Run shard
        env:
          ROBUST_DRAWS: ${{ inputs.draws }}
        run: python3 tools/robust.py run --data data/${{ inputs.set }} --set ${{ inputs.set }} --shard ${{ matrix.shard }} --shards ${{ inputs.shards }} --out .work/r-${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: robust-${{ matrix.shard }}
          path: .work/r-${{ matrix.shard }}.csv
          retention-days: 7

  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: robust-*
          path: .work
          merge-multiple: true
      - name: Merge and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/robust.py merge --inputs ".work/r-*.csv" --out results/robustness/${{ inputs.set }}.csv.gz | tee -a "$GITHUB_STEP_SUMMARY"
            git add results/robustness
            git commit -q -m "Robustness results: ${{ inputs.set }}" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((5 * i))
          done
          exit 1
