name: Exact check

# CP-SAT joint-feasibility check of every 60-task dev and expansion instance (protocol:
# docs/proposed/EXPERIMENTS_PAPER1.md). Found schedules are rebuilt with the pinned evaluator.
# Results: results/exact/exact-60.csv.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel machines"
        default: "20"

permissions:
  contents: write

concurrency:
  group: exact
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: python3 -c "import json;print('matrix='+json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -r requirements.txt "ortools==9.12.4544"
      - name: Download and verify data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/data.py fetch --set dev --out data/dev
          python3 tools/data.py fetch --set expansion --out data/expansion
      - name: Run shard
        run: python3 tools/exact.py run --data-dev data/dev --data-expansion data/expansion --shard ${{ matrix.shard }} --shards ${{ inputs.shards }} --out .work/x-${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: exact-${{ matrix.shard }}
          path: .work/x-${{ matrix.shard }}.csv
          retention-days: 7

  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-*
          path: .work
          merge-multiple: true
      - name: Merge and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/exact.py merge --inputs ".work/x-*.csv" --out results/exact/exact-60.csv | tee -a "$GITHUB_STEP_SUMMARY"
            git add results/exact
            git commit -q -m "Exact check results: 60-task instances" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((5 * i))
          done
          exit 1
