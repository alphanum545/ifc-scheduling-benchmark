name: Tests

# Unit tests for the harness plus the historical algorithm tests (unchanged from the
# original benchmark repository). Runs on every push and pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Dataset evaluator and pytest
        run: pip install --quiet -r requirements.txt pytest
      - name: Harness tests
        run: python -m pytest -q tests/test_harness.py
      - name: Historical algorithm tests
        run: python -m pytest -q tests/historical
      - name: Ablation faithfulness tests
        run: python -m pytest -q tests/test_dcr_ablations.py
