name: Benchmark

# Actions tab -> Benchmark -> Run workflow. Only runs not already in results/store.csv are
# executed (an algorithm reruns automatically when any of its source files change).
# Results: results/reports/<report_name>/ in the repository, and as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      algos:
        description: "Algorithms (comma-separated IDs from algorithms.toml, or all)"
        default: "all"
      highlight:
        description: "Proposed algorithm to highlight (gains/losses computed against it)"
        default: "dcr-v1-admission"
      set:
        description: "Instance set: dev (160), expansion (1,890) or unseen (2,241; final test, run once)"
        default: "dev"
        type: choice
        options: [dev, expansion, unseen, grid]
      suite:
        description: "dev set only: smoke (5), core (24) or all (160). Use all for expansion"
        default: "all"
      families:
        description: "Families, e.g. montage,sipht (or all)"
        default: "all"
      tasks:
        description: "Task counts, e.g. 60,1000 (or all)"
        default: "all"
      qos:
        description: "QoS profiles: relaxed, moderate, tight (or all)"
        default: "all"
      reps:
        description: "Repetitions per run (1 = fastest; 2 also re-observes determinism)"
        default: "1"
      workers:
        description: "Parallel instance processes per machine (0 = all cores; 1 = clean runtime study)"
        default: "0"
      report_name:
        description: "Report folder name under results/reports/"
        default: "latest"
      shards:
        description: "Number of shards (jobs); 20 run at a time on a free account, the rest queue"
        default: "60"
      force:
        description: "Ignore stored results and rerun everything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bench-store
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      todo: ${{ steps.plan.outputs.todo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: plan
        name: Plan runs
        run: |
          python3 tools/bench.py plan --set "${{ inputs.set }}" --algos "${{ inputs.algos }}" --suite "${{ inputs.suite }}" \
            --families "${{ inputs.families }}" --tasks "${{ inputs.tasks }}" --qos "${{ inputs.qos }}" \
            --reps "${{ inputs.reps }}" --workers "${{ inputs.workers }}" --shards "${{ inputs.shards }}" ${{ inputs.force && '--force' || '' }} \
            --github-output "$GITHUB_OUTPUT" | tee plan.log
          { echo "## Plan"; echo '```'; cat plan.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: .work/plan.json
          include-hidden-files: true
          retention-days: 3

  run:
    needs: plan
    if: ${{ needs.plan.outputs.todo != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .work
      - name: Download and verify data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/data.py fetch --set ${{ inputs.set }} --out data/${{ inputs.set }}
      - name: Run shard ${{ matrix.shard }}
        run: python3 tools/bench.py run --data data/${{ inputs.set }} --shard ${{ matrix.shard }} --out .work/shard-${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: shard-${{ matrix.shard }}
          path: .work/shard-${{ matrix.shard }}.csv
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  report:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet matplotlib openpyxl
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: .work
          merge-multiple: true
      - name: Merge, report and commit (re-synced with the latest main on every attempt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # Another run may have committed to the store after this run started: always rebuild
            # the store and report on top of the newest main instead of rebasing a stale store.
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/bench.py merge --inputs ".work/shard-*.csv"
            python3 tools/report.py --set "${{ inputs.set }}" --algos "${{ inputs.algos }}" --highlight "${{ inputs.highlight }}" \
              --suite "${{ inputs.suite }}" --families "${{ inputs.families }}" --tasks "${{ inputs.tasks }}" \
              --qos "${{ inputs.qos }}" --name "${{ inputs.report_name }}" > /dev/null
            python3 tools/verify_replay.py --out results/replay.md > /dev/null
            git add results/store.csv results/replay.md "results/reports/${{ inputs.report_name }}"
            git commit -q -m "Benchmark results: ${{ inputs.report_name }}" || { echo "nothing new"; exit 0; }
            if git push -q origin HEAD:main; then
              cat "results/reports/${{ inputs.report_name }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((5 * i))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.report_name }}
          path: results/reports/${{ inputs.report_name }}
